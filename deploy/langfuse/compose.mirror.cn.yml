# 国内网络覆盖：仅替换镜像来源，不改任何行为。cgr.dev/minio 本机可直连，不在此覆盖。
# 用法：docker compose --env-file .env -f compose.yml -f compose.mirror.cn.yml <pull|up -d|ps|logs...>
services:
  langfuse-worker:
    image: m.daocloud.io/docker.io/langfuse/langfuse-worker:4.50.0
  langfuse-web:
    image: m.daocloud.io/docker.io/langfuse/langfuse:4.50.0
  clickhouse:
    image: m.daocloud.io/docker.io/clickhouse/clickhouse-server:25.12
  postgres:
    image: m.daocloud.io/docker.io/library/postgres:17
  redis:
    image: m.daocloud.io/docker.io/library/redis:7
