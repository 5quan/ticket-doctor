# 部署形态：Host（Web API + SSE + 调度 + Runner）与 Go 接入适配器分进程。
#
# 用法：
#   cp .env.example .env   # 填 LARK_* / DEEPSEEK_API_KEY
#   docker compose up -d --build
#   open http://localhost:3000/          # Web 会话页
#   # 飞书事件回调地址指向 http://<adapter>:3002/feishu/events
#
# 数据来源一律运行时只读挂载：被诊断的源码只读挂载到 /repos，日志只读挂载到 /logs。
services:
  host:
    build: .
    image: ticket-doctor-host:local
    env_file:
      - path: .env
        required: false
    environment:
      TD_DATA_DIR: /data
      TD_HOST: 0.0.0.0
      TD_HOST_PORT: "3000"
      # 生产：独立 Runner 子进程；飞书交给 Go 适配器
      TD_RUNNER_MODE: process
      TD_FEISHU_DIRECT: "false"
      TD_REPOS: app:/repos/app
      TD_LOG_DIR: /logs
      TD_ALLOWED_REPOS: app
    volumes:
      - ticket-data:/data
      # 只读挂载：源码仓库（含历史对象）与日志目录
      - ${TD_REPOS_DIR:-./fixtures/demo-repo}:/repos/app:ro
      - ${TD_LOG_DIR_HOST:-./fixtures/samples}:/logs:ro
    ports:
      - "3000:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/agent/capabilities').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  adapter:
    build: ./adapters/go
    image: ticket-doctor-adapter:local
    env_file:
      - path: .env
        required: false
    environment:
      ADAPTER_ADDR: 0.0.0.0:3002
      HOST_API_BASE: http://host:3000/api/agent
      LARK_API_BASE: https://open.feishu.cn/open-apis
      ADAPTER_POLL_INTERVAL_MS: "1000"
    ports:
      - "3002:3002"
    depends_on:
      host:
        condition: service_healthy
    restart: unless-stopped

volumes:
  ticket-data:
